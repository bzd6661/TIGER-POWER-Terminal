<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIGER POWER · 钱包追踪</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="/i18n.js"></script>
<script src="/localpop.js"></script>
<script src="/fmt.js"></script>
<script src="/icons.js"></script>
<script src="/update.js" defer></script>
<style>
  :root {
    --bg:#0a0c0f; --s1:#101318; --s2:#151920; --s3:#1b2029; --line:#1e232c; --line2:#2a313d;
    --text:#e7eaf0; --mute:#8d96a7; --faint:#5b6372;
    --up:#16c784; --up-bg:rgba(22,199,132,.12); --down:#ea3943; --down-bg:rgba(234,57,67,.12);
    --acc:#f0b90b; --blue:#3b82f6; --blue-bg:rgba(59,130,246,.14);
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.45 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  a { color:inherit; }
  .num { font-variant-numeric:tabular-nums; } .mono { font-family:Consolas, monospace; }
  .mute { color:var(--mute); } .faint { color:var(--faint); } .up { color:var(--up); } .down { color:var(--down); }
  ::-webkit-scrollbar { width:5px; height:5px; } ::-webkit-scrollbar-thumb { background:#2a313d; border-radius:3px; } ::-webkit-scrollbar-track { background:transparent; }
  .top { flex:0 0 50px; display:flex; align-items:center; gap:14px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--s1); }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; white-space:nowrap; }
  .xlink { display:inline-flex; align-items:center; gap:6px; flex:none; color:var(--text); background:var(--s3); text-decoration:none; font-size:12px; font-weight:600; padding:5px 10px; border:1px solid var(--line2); border-radius:999px; }
  .xlink svg { width:13px; height:13px; } .xlink:hover { border-color:var(--acc); color:var(--acc); }
  .brand .tmlogo { width:24px; height:24px; flex:none; display:block; filter:drop-shadow(0 1px 4px rgba(240,185,11,.25)); }
  .brand > span { font-weight:800; letter-spacing:.5px; } .brand .tmsub { font-size:11px; font-weight:500; color:var(--mute); margin-left:-2px; }
  @media (max-width:820px) { .brand .tmsub { display:none; } }
  .setwrap { position:relative; flex:none; }
  .setbtn { background:var(--s2); border:1px solid var(--line2); border-radius:999px; padding:6px 12px; font-size:13px; color:var(--text); white-space:nowrap; text-decoration:none; display:inline-block; }
  .setbtn:hover, .setbtn.on { border-color:var(--acc); }
  .setmenu { position:absolute; right:0; top:calc(100% + 8px); z-index:70; width:290px; background:var(--s1); border:1px solid var(--line2); border-radius:12px; padding:6px; box-shadow:0 12px 32px rgba(0,0,0,.5); }
  .setmenu button { display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; border-radius:8px; padding:8px 10px; text-align:left; color:var(--text); }
  .setmenu button:hover { background:var(--s3); } .setmenu .mi { width:26px; text-align:center; font-size:16px; }
  .setmenu b { display:block; font-size:13px; } .setmenu small { display:block; font-size:11px; color:var(--faint); }
  .secflash { animation:secflash 1.6s ease-out; } @keyframes secflash { 0% { box-shadow:0 0 0 2px var(--acc); } 100% { box-shadow:0 0 0 2px transparent; } }
  @media (max-width:820px) { .setbtn { padding:5px 9px; font-size:12px; } }
  .setmenu a.setitem { display:flex; align-items:center; gap:10px; border-radius:8px; padding:8px 10px; color:var(--text); text-decoration:none; } .setmenu a.setitem:hover { background:var(--s3); }
  .tipbtn { flex:none; border:0; border-radius:999px; padding:7px 14px; font-weight:800; font-size:13px; color:#1a1300; background:linear-gradient(135deg,#F8D33A,#E8890C); text-decoration:none; white-space:nowrap; box-shadow:0 0 0 0 rgba(240,185,11,.55); animation:tippulse 2.6s ease-out infinite; }
  .tipbtn:hover { filter:brightness(1.08); animation:none; box-shadow:0 0 14px rgba(240,185,11,.55); }
  @keyframes tippulse { 0% { box-shadow:0 0 0 0 rgba(240,185,11,.55); } 70% { box-shadow:0 0 0 9px rgba(240,185,11,0); } 100% { box-shadow:0 0 0 0 rgba(240,185,11,0); } }
  .nav { display:flex; gap:4px; }
  .nav a { color:var(--mute); text-decoration:none; padding:6px 10px; border-radius:8px; white-space:nowrap; font-size:13px; } .nav a.on, .nav a:hover { color:var(--text); background:var(--s3); }
  .livetag { display:flex; align-items:center; gap:6px; color:var(--mute); font-size:12px; } .dot { width:7px; height:7px; border-radius:50%; background:var(--faint); } .dot.on { background:var(--up); box-shadow:0 0 6px var(--up); } .dot.off { background:var(--down); }
  .main { flex:1; display:flex; min-height:0; }
  .side { flex:0 0 320px; border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--s1); }
  .add { padding:12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .add input, .add select { background:var(--s2); border:1px solid var(--line2); border-radius:7px; padding:6px 9px; outline:0; width:100%; }
  .add .row { display:flex; gap:6px; }
  .btn { background:var(--acc); color:#1a1300; border:0; border-radius:7px; padding:6px 14px; font-weight:700; white-space:nowrap; }
  .btn:disabled { opacity:.5; }
  .groups { display:flex; flex-wrap:wrap; gap:4px; padding:8px 12px; border-bottom:1px solid var(--line); }
  .groups button { background:none; border:1px solid transparent; color:var(--mute); border-radius:6px; padding:2px 8px; font-size:12px; }
  .groups button.on { border-color:var(--line2); color:var(--text); background:var(--s3); }
  .tlist { flex:1; overflow:auto; }
  .titem { padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .titem:hover { background:var(--s2); } .titem.on { background:var(--s3); box-shadow:inset 3px 0 0 var(--acc); }
  .titem .r1 { display:flex; align-items:center; gap:6px; } .titem .r1 b { color:var(--acc); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
  .titem .r1 .x { margin-left:auto; background:none; border:0; color:var(--faint); padding:0 2px; } .titem .r1 .x:hover { color:var(--down); }
  .titem .r2 { display:flex; gap:8px; font-size:11px; color:var(--faint); margin-top:2px; }
  .titem .rm { font-size:12px; color:var(--mute); margin-top:3px; cursor:text; } .titem .rm:empty::before { content:"+ 备注"; color:var(--faint); }
  .tag { font-size:10px; padding:0 5px; border-radius:4px; background:var(--s3); color:var(--mute); }
  .feedwrap { flex:1; display:flex; flex-direction:column; min-width:0; }
  .fhead { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .fhead h2 { margin:0; font-size:14px; }
  .sw { display:flex; align-items:center; gap:6px; color:var(--mute); font-size:12px; cursor:pointer; }
  .feed { flex:1; overflow:auto; }
  table { width:100%; border-collapse:collapse; }
  th { position:sticky; top:0; background:var(--s1); color:var(--faint); font-weight:400; font-size:12px; text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); }
  td { padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tr.new td { animation:flash 2.5s ease-out; } @keyframes flash { from { background:rgba(240,185,11,.18); } to { background:transparent; } }
  .act { font-weight:700; padding:1px 7px; border-radius:5px; font-size:12px; }
  .act.建仓, .act.加仓, .act.买入 { color:var(--up); background:var(--up-bg); } .act.减仓, .act.清仓, .act.卖出 { color:var(--down); background:var(--down-bg); }
  .act.清仓 { outline:1px solid var(--down); }
  .cal { display:flex; align-items:center; gap:6px; margin-top:2px; font-size:11px; color:var(--faint); }
  .cal .cp { background:none; border:1px solid var(--line2); border-radius:5px; color:var(--mute); font-size:11px; padding:0 6px; } .cal .cp:hover { color:var(--text); }
  .cal .go { color:var(--acc); text-decoration:none; font-weight:600; } .cal .go:hover { text-decoration:underline; }
  .who { color:var(--acc); cursor:pointer; } .tok { cursor:pointer; font-weight:600; } .tok:hover, .who:hover { text-decoration:underline; }
  .pf { font-size:11px; color:var(--faint); }
  .more { padding:14px; text-align:center; } .more button { background:var(--s2); border:1px solid var(--line2); border-radius:8px; padding:6px 16px; color:var(--mute); }
  .empty { padding:40px; text-align:center; color:var(--faint); }
  .note { font-size:12px; color:var(--mute); }
  .toasts { position:fixed; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; z-index:99; }
  .toast { background:var(--s3); border:1px solid var(--line2); border-radius:9px; padding:9px 13px; max-width:380px; font-size:12px; } .toast.err { border-color:var(--down); } .toast.ok { border-color:var(--up); }
  .toast.click { cursor:pointer; } .toast.click:hover { border-color:var(--acc); } .toast.click::after { content:"  点击打开 →"; color:var(--acc); font-weight:600; }
  .vtabs { display:flex; gap:2px; background:var(--s2); border-radius:8px; padding:2px; }
  .vtabs button { background:none; border:0; color:var(--mute); border-radius:6px; padding:3px 10px; font-size:13px; } .vtabs button.on { background:var(--s3); color:var(--text); }
  .pill { font-size:10px; padding:0 5px; border-radius:8px; background:var(--up-bg); color:var(--up); } .pill.real { background:var(--down-bg); color:var(--down); }
  .kill { background:var(--down-bg); color:var(--down); border:1px solid var(--down); border-radius:7px; padding:3px 10px; font-size:12px; font-weight:700; } .kill.on { background:var(--up-bg); color:var(--up); border-color:var(--up); }
  .titem .r1 .cpy { margin-left:auto; background:none; border:1px solid var(--line2); border-radius:5px; color:var(--mute); font-size:11px; padding:0 6px; } .titem .r1 .cpy:hover { color:var(--acc); border-color:var(--acc); }
  .titem .r1 .cpy + .x { margin-left:2px; }
  .cbar { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .seg { display:flex; gap:2px; } .seg button { background:none; border:1px solid var(--line2); color:var(--mute); padding:3px 10px; font-size:12px; border-radius:6px; } .seg button.on { color:var(--text); background:var(--s3); }
  .ctab td { white-space:normal; vertical-align:top; } .ctab .ops { white-space:nowrap; text-align:right; }
  .ctab .ops button, .ltab button { background:var(--s2); border:1px solid var(--line2); border-radius:6px; padding:2px 9px; font-size:12px; margin-left:4px; } .ctab .ops button.go { border-color:var(--up); color:var(--up); }
  .tag.realtag { background:var(--down-bg); color:var(--down); }
  .lhead { padding:12px 14px 6px; font-weight:600; font-size:13px; }
  .ltab td { font-size:12px; padding:5px 10px; vertical-align:top; } .ltab .lr { white-space:normal; }
  .lk { font-size:11px; padding:0 6px; border-radius:4px; background:var(--s3); } .lk.up { color:var(--up); background:var(--up-bg); } .lk.down { color:var(--down); background:var(--down-bg); }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:90; display:flex; align-items:center; justify-content:center; padding:16px; }
  .mbox { background:var(--s1); border:1px solid var(--line2); border-radius:12px; width:640px; max-width:100%; max-height:92vh; display:flex; flex-direction:column; }
  .mhead, .mfoot { display:flex; align-items:center; gap:10px; padding:12px 16px; } .mhead { border-bottom:1px solid var(--line); } .mfoot { border-top:1px solid var(--line); justify-content:flex-end; }
  .mhead .x { margin-left:auto; background:none; border:0; color:var(--mute); font-size:15px; }
  .mbody { overflow:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .fl { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--mute); flex:1; min-width:150px; }
  .fl input, .fl select { background:var(--s2); border:1px solid var(--line2); border-radius:7px; padding:6px 9px; outline:0; color:var(--text); }
  .fl input:disabled { opacity:.6; }
  .frow { display:flex; gap:10px; flex-wrap:wrap; } .ckrow { align-items:center; font-size:12px; }
  .ck { display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; }
  .grp { border:1px solid var(--line); border-radius:9px; padding:10px 12px; display:flex; flex-direction:column; gap:8px; } .gt { font-weight:700; font-size:12px; color:var(--acc); }
  @media (max-width:820px) { body { overflow:auto; } .main { flex-direction:column; } .side { flex:none; border-right:0; } }
  /* 顶栏放不下时:先藏 Logo 小字和推特账号文字,间距收紧,搜索框可以缩窄 */
  @media (max-width:1600px) { .brand .tmsub { display:none; } .xlink span { display:none; } }
  @media (max-width:1500px) { .top { gap:10px; } .searchwrap, .search { min-width:120px; } }
  @media (max-width:1300px) { .livetag { display:none; } .clipchip.ask { display:none; } }

  /* ===== 统一设计规范(三个页面共用;放在样式最后,覆盖前面各写各的) =====
     颜色只表达「需要你注意」的事:税 = 琥珀,分红 = 绿,门槛 / 风险 / 暂停 = 红,费用和数据提示 = 蓝;
     平台、底池币等信息一律中性灰,平台前面加一个小色点(和扫链头像角标同一组颜色)。标签字重 500,让币名和价格最显眼。 */
  :root {
    --faint:#6f7889;
    --tg-neutral:#b4bcc8; --tg-neutral-bg:#1f2530;
    --tg-tax:#e8b04a;  --tg-tax-bg:rgba(232,176,74,.13);
    --tg-div:#3fcf98;  --tg-div-bg:rgba(22,199,132,.13);
    --tg-risk:#ff6b74; --tg-risk-bg:rgba(234,57,67,.14);
    --tg-info:#8fb3ff; --tg-info-bg:rgba(59,130,246,.13);
    --pc-four:#e0b23a; --pc-gang:#d77aa8; --pc-flap:#9b86e0;
  }
  /* 顶栏:三个页面同样高度、间距、控件高度 */
  .top { flex:0 0 50px; height:50px; gap:12px; padding:0 14px; }
  .search, .clipchip, .wchip { height:32px; }
  /* 打赏:次级按钮,不闪不渐变 */
  .tipbtn { animation:none; background:var(--s2); color:var(--acc); border:1px solid rgba(240,185,11,.4); box-shadow:none; padding:5px 12px; font-weight:700; font-size:12.5px; border-radius:8px; }
  .tipbtn:hover { border-color:var(--acc); filter:none; box-shadow:none; }
  /* 标签:一个规格 */
  .tg, .mtags .mtg, .badges .bdg, .tlist .tag, .ctab .tag {
    display:inline-flex; align-items:center; gap:5px; height:20px; line-height:20px; padding:0 7px; border:0; border-radius:4px;
    font-size:11.5px; font-weight:500; white-space:nowrap; box-sizing:border-box; background:var(--tg-neutral-bg); color:var(--tg-neutral);
  }
  .tg.tax, .mtags .mtg.k-tax, .badges .bdg.tax { color:var(--tg-tax); background:var(--tg-tax-bg); }
  .tg.good, .mtags .mtg.k-div, .badges .bdg.good { color:var(--tg-div); background:var(--tg-div-bg); }
  .tg.bad, .tg.gate, .mtags .mtg.k-bad, .badges .bdg.bad, .tag.realtag { color:var(--tg-risk); background:var(--tg-risk-bg); }
  .tg.fee, .tg.info, .badges .bdg.info { color:var(--tg-info); background:var(--tg-info-bg); }
  .pdot { width:6px; height:6px; border-radius:50%; flex:none; display:inline-block; }
  .pd-four { background:var(--pc-four); } .pd-gang { background:var(--pc-gang); } .pd-flap { background:var(--pc-flap); } .pd-in { background:var(--up); } .pd-out { background:var(--blue, #3b82f6); }
  /* 扫链头像角标:和平台色点同一组颜色 */
  .p-four { background:var(--pc-four); } .p-gangv1, .p-gangv2, .p-gangv3 { background:var(--pc-gang); } .p-idagent, .p-flapportal { background:var(--pc-flap); }

  /* 一页只留一个主按钮:跟单页的「新建跟单」改成次级按钮 */
  #cpNew { background:var(--s2); color:var(--text); border:1px solid var(--line2); }

  /* ===== 追踪页整理(只作用于本页) ===== */
  .top .tspacer { flex:1; min-width:0; }
  .tk-ic { display:inline-flex; vertical-align:-2px; margin-right:5px; } .setmenu .mi.tk-ic { margin-right:0; justify-content:center; color:var(--mute); }
  .toast .tk-ic { margin-right:6px; color:var(--acc); }
  .sw .tk-ic { margin-right:0; }
  /* 左侧「添加关注」:次级描边按钮(一页只留一个实心金色主按钮) */
  .btn.tk-sec { background:var(--s2); color:var(--acc); border:1px solid rgba(240,185,11,.4); font-weight:700; }
  .btn.tk-sec:hover:not(:disabled) { border-color:var(--acc); }
  /* 动态表:限宽;复制 / 𝕏 只在悬停时出现(占位不变) */
  table.tk-feed { max-width:1100px; }
  .tk-feed .cal .tk-hov { display:inline-flex; gap:6px; visibility:hidden; } .tk-feed tr:hover .cal .tk-hov { visibility:visible; }
  .tk-feed .tk-ops { text-align:right; } .tk-feed .tk-ops .go { color:var(--acc); text-decoration:none; font-weight:600; } .tk-feed .tk-ops .go:hover { text-decoration:underline; }
  .tk-feed .tk-tx { display:inline-flex; vertical-align:-2px; margin-left:8px; color:var(--faint); } .tk-feed .tk-tx:hover { color:var(--text); }
  .tk-sk td { height:52px; } .tk-sk div { height:14px; border-radius:4px; background:linear-gradient(90deg,var(--s2),var(--s3),var(--s2)); background-size:200% 100%; animation:tksk 1.2s linear infinite; }
  @keyframes tksk { from { background-position:200% 0; } to { background-position:0 0; } }
  /* 空状态:一行,可带一个操作 */
  .empty { padding:14px 16px; text-align:left; display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--faint); }
  .tk-emact { height:24px; padding:0 10px; border-radius:6px; background:var(--s2); border:1px solid var(--line2); color:var(--text); font-size:12px; }
  .tk-emact:hover { border-color:var(--acc); }
  /* 分段控件:两种尺寸 —— 小 24px / 圆角 6,中 30px / 圆角 7 */
  .seg button, .groups button { height:24px; border-radius:6px; padding:0 9px; font-size:12px; display:inline-flex; align-items:center; }
  .vtabs { padding:0; border-radius:7px; } .vtabs button { height:30px; border-radius:7px; padding:0 12px; font-size:13px; display:inline-flex; align-items:center; }
  .kill { height:30px; border-radius:7px; }

  /* ===== 窄屏 / 手机(≤820px):顶栏分两行排,不把页面撑宽 =====
     页面一比屏幕宽,手机浏览器就按内容宽度排版,居中的弹窗(比如公开版的登录框)会跑到屏幕外面。
     第一行 Logo + 导航;第二行 中英 / 𝕏 / 打赏 / 设置靠右(设置只留齿轮图标,排最后,菜单往左展开不出屏) */
  @media (max-width:820px) {
    .top { flex:0 0 auto; height:auto; flex-wrap:wrap; gap:0 8px; padding:4px 10px; }
    .top > * { margin-top:4px; margin-bottom:4px; }
    .top::after { content:""; order:3; flex-basis:100%; }   /* 导航后面强制换行 */
    .top .tspacer { display:none; }
    .top .brand { order:1; }
    .top .nav { order:2; }
    .top .nav a { padding:6px 8px; }
    .top .langbtn { order:4; margin-left:auto; }
    .top .xlink { order:5; }
    .top .tp-hchip { order:6; margin-left:0; }
    .top .tipbtn { order:7; }
    .top .setwrap { order:8; }
    .top .setbtn { display:inline-flex; align-items:center; height:30px; font-size:0; gap:0; padding:0 9px; }
    .top .setbtn .tk-ic { margin-right:0; }
  }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><svg class="tmlogo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="tmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8D33A"/><stop offset="1" stop-color="#E8890C"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#tmg)"/><path d="M5 10.5H14.5M9.75 10.5V23M18.5 23V10.5H23.25A3.5 3.5 0 0 1 23.25 17.5H18.5" fill="none" stroke="#1a1300" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>TIGER POWER</span><small class="tmsub">内盘终端</small></div>
  <div class="nav"><a href="/trade">交易</a><a href="/scan">扫链</a><a href="/track" class="on">追踪</a></div>
  <span class="tspacer"></span>
  <span class="livetag" id="liveTag"><span class="dot" id="liveDot"></span>实时</span>
  <div class="setwrap"><button class="setbtn" id="setBtn" title="钱包、转账、设置、授权"><span data-ic="gear"></span>钱包 / 设置</button><div class="setmenu" id="setMenu" hidden><a href="/trade?go=secWallets" class="setitem"><span class="mi" data-ic="wallet" data-ics="16"></span><span><b>钱包与持仓</b><small>余额、登录状态、全部持仓和盈亏</small></span></a><a href="/trade?go=sendBox" class="setitem"><span class="mi" data-ic="ext" data-ics="16"></span><span><b>转账</b><small>BNB / 代币转到任意地址</small></span></a><a href="/trade?go=secSettings" class="setitem"><span class="mi" data-ic="gear" data-ics="16"></span><span><b>设置</b><small>单笔上限、发射后自动转出、自动领取</small></span></a><a href="/trade?go=secQuotes" class="setitem"><span class="mi" data-ic="refresh" data-ics="16"></span><span><b>底池币余额</b><small>内盘卖出后剩下的,一键换回 BNB</small></span></a><a href="/trade?go=secApprovals" class="setitem"><span class="mi" data-ic="lock" data-ics="16"></span><span><b>授权管理</b><small>查看 / 撤销代币授权</small></span></a></div></div>
  <a class="tipbtn" href="/trade?tip=1" title="请作者喝杯咖啡"><span data-ic="coffee"></span>打赏作者</a>
  <a class="xlink" href="https://x.com/tiger_web3" target="_blank" rel="noopener" title="作者推特 @tiger_web3"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg><span>@tiger_web3</span></a>
</div>
<div class="main">
  <aside class="side">
    <div class="add">
      <input id="aIn" placeholder="地址 0x… 或 .ai / .bnb 名字" spellcheck="false" autocomplete="off">
      <div class="row"><input id="aRm" placeholder="备注(可选)" maxlength="80"><select id="aGrp" style="flex:0 0 96px"></select></div>
      <div class="row"><button class="btn tk-sec" id="aGo" style="flex:1">添加关注</button></div>
      <div class="faint" style="font-size:11px">新加的地址会自动补出最近 24 小时的内盘买卖</div>
    </div>
    <div class="groups" id="groups"></div>
    <div class="tlist" id="tlist"></div>
  </aside>
  <section class="feedwrap">
    <div class="fhead">
      <div class="vtabs"><button id="tabFeed" class="on">追踪动态</button><button id="tabCopy">跟单</button></div>
      <h2 id="fTitle">全部动态</h2>
      <span class="note" id="fNote"></span>
      <button class="kill" id="killBtn" hidden title="所有跟单任务立刻停止下单">全部暂停</button>
      <label class="sw" style="margin-left:auto"><input type="checkbox" id="sndOn"><span data-ic="bell"></span>提示音</label>
    </div>
    <div class="feed" id="feed"></div>
    <div class="feed copyview" id="copyView" hidden></div>
  </section>
</div>
<div class="modal" id="cpDlg" hidden><div class="mbox">
  <div class="mhead"><b id="cpTitle">新建跟单</b><button class="x" id="cpClose">✕</button></div>
  <div class="mbody">
    <label class="fl">跟谁<input id="cpTarget" placeholder="地址 0x…(还没关注会自动加进追踪)" spellcheck="false"></label>
    <label class="fl">任务名<input id="cpName" placeholder="可选,默认用对方的名字" maxlength="40"></label>
    <div class="grp"><div class="gt">金额</div>
      <div class="frow"><label class="fl">方式<select id="cpMode"><option value="fixed">每次固定 BNB</option><option value="ratio">按对方买入的比例</option></select></label>
        <label class="fl" id="cpAmtL">每次买入(BNB / 每个钱包)<input id="cpAmt" type="number" step="0.001" min="0"></label>
        <label class="fl" id="cpRatioL" hidden>跟对方的 %<input id="cpRatio" type="number" step="1" min="0"></label></div>
      <div class="frow"><label class="fl">最多跟几次(0 = 不限)<input id="cpMaxCopies" type="number" step="1" min="0"></label>
        <label class="fl">单笔上限 BNB<input id="cpMaxTrade" type="number" step="0.01" min="0" max="0.5"></label>
        <label class="fl">每个币最多 BNB<input id="cpMaxToken" type="number" step="0.01" min="0"></label></div>
      <div class="frow"><label class="fl">每天最多 BNB(所有钱包合计)<input id="cpDaily" type="number" step="0.01" min="0"></label>
        <label class="fl">最多同时持有几个币<input id="cpMaxOpen" type="number" step="1" min="1"></label></div>
    </div>
    <div class="grp"><div class="gt">条件</div>
      <label class="ck"><input type="checkbox" id="cpOnlyFirst"> 只跟建仓(对方第一次买这个币;同一个币只跟一次)</label>
      <div class="frow"><label class="fl">对方买入下限 BNB(0 = 不限)<input id="cpMinT" type="number" step="0.01" min="0"></label>
        <label class="fl">对方买入上限 BNB(0 = 不限)<input id="cpMaxT" type="number" step="0.01" min="0"></label>
        <label class="fl">市值上限 $(0 = 不限)<input id="cpMaxMc" type="number" step="1000" min="0"></label></div>
      <div class="frow"><label class="fl">最多晚几秒(超过就不跟)<input id="cpDelay" type="number" step="1" min="1"></label>
        <label class="fl">滑点 %<input id="cpSlip" type="number" step="1" min="1" max="50"></label></div>
      <div class="frow ckrow"><span class="faint">平台</span><label class="ck"><input type="checkbox" data-pf="four"> four</label><label class="ck"><input type="checkbox" data-pf="gang"> Gang</label><label class="ck"><input type="checkbox" data-pf="flap"> Flap 内盘</label></div>
      <div class="frow ckrow"><span class="faint">用哪个钱包</span><label class="ck"><input type="checkbox" data-w="1"> 账号 1</label><label class="ck"><input type="checkbox" data-w="2"> 账号 2</label></div>
      <label class="ck"><input type="checkbox" id="cpFollowSell"> 跟卖:对方卖出时,按他卖出的比例卖我跟买的仓位(对方清仓我也清仓)</label>
    </div>
    <div class="grp"><div class="gt">运行方式</div>
      <label class="ck"><input type="checkbox" id="cpDry"> 模拟(只记录会怎么下单,不花钱)—— 建议先模拟跑一段时间看记录</label>
      <div class="faint" style="font-size:11px">新任务建好后是「暂停」状态,在列表里点「启动」才开始。单笔硬上限 0.5 BNB;已提交的订单不管最后成没成都按花了钱算。</div>
    </div>
  </div>
  <div class="mfoot"><span class="down" id="cpErr"></span><button class="btn" id="cpSave">保存</button></div>
</div></div>
<div class="toasts" id="toasts"></div>

<script>
const TOKEN_INIT = "__PANEL_TOKEN__";
let TOKEN = TOKEN_INIT;
window.tpLocalPop?.init(() => TOKEN, { stream: false });   // 本机弹窗:网站请求的配对码 / 批准框 / 登录请求(网站发的页面里没有这个脚本,这一行什么都不做)。
//   不另开推送:用页面自己这条(收到的每条事件转给 tpLocalPop.event)。浏览器对同一个地址最多 6 条连接,每页两条的话三个页面一开就占满了
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (a) => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
// 数字 / 时间统一走 /fmt.js;age 带「前」
function num(x, d) { return FMT.num(x, d); }
const age = (ts) => ts ? FMT.ago(ts) + "前" : "";
// 静态按钮上的单色图标(data-ic="名字",data-ics 可选尺寸)
document.querySelectorAll("[data-ic]").forEach((el) => { el.classList.add("tk-ic"); el.innerHTML = ICON(el.dataset.ic, +el.dataset.ics || 14); });
const fullTime = (ts) => new Date(ts * 1000).toLocaleString();
const PF = { four: "four", gangv1: "Gang V1", gangv2: "Gang V2", idagent: "Flap 内盘" };
async function refreshToken() {
  const html = await fetch(location.pathname, { cache: "no-store" }).then((r) => r.text());
  const m = html.match(/const TOKEN_INIT = "([0-9a-f]{48})"/);
  if (m) TOKEN = m[1];
  return !!m;
}
async function post(path, body = {}) {
  const send = () => fetch(path, { method: "POST", headers: { "content-type": "application/json", "x-panel-token": TOKEN }, body: JSON.stringify(body) });
  let r = await send();
  if (r.status === 403 && /令牌/.test(await r.clone().text()) && (await refreshToken())) r = await send();
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
// ca:带上代币地址时这条提示可以点,点了打开这个币(交易页)
function toast(msg, kind = "", ca = null, ic = null) {
  const t = document.createElement("div"); t.className = "toast " + kind + (ca ? " click" : ""); t.innerHTML = (ic ? `<span class="tk-ic">${ICON(ic, 13)}</span>` : "") + esc(msg);
  if (ca) { t.title = "点击打开 " + ca; t.onclick = () => { t.remove(); location.href = "/trade?ca=" + ca; }; }
  $("toasts").appendChild(t); setTimeout(() => t.remove(), kind === "err" ? 9000 : ca ? 8000 : 5000);
}
function beep() {
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 660; g.gain.setValueAtTime(0.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.31); } catch {}
}
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let L = { targets: [], groups: ["默认"] }, grp = store.get("trkGrp", "all"), sel = null, items = [], more = false, loading = false;
$("sndOn").checked = store.get("trkSnd", "1") === "1";
$("sndOn").onchange = () => store.set("trkSnd", $("sndOn").checked ? "1" : "0");

async function loadList() {
  try { L = await post("/api/track"); } catch (e) { toast("读关注列表失败:" + e.message, "err"); return; }
  if (grp !== "all" && !L.groups.includes(grp)) grp = "all";
  if (sel && !L.targets.some((t) => t.address === sel)) sel = null;
  renderSide(); renderHead();
}
function renderSide() {
  $("aGrp").innerHTML = L.groups.map((g) => `<option>${esc(g)}</option>`).join("");
  if (grp !== "all") $("aGrp").value = grp;
  $("groups").innerHTML = [["all", `全部 ${L.targets.length}`], ...L.groups.map((g) => [g, `${g} ${L.targets.filter((t) => t.group === g).length}`])]
    .map(([k, n]) => `<button data-g="${esc(k)}" class="${k === grp ? "on" : ""}">${esc(n)}</button>`).join("") +
    `<button data-act="addg" title="新建分组">+</button>${grp !== "all" && grp !== "默认" ? '<button data-act="delg" title="删除分组(里面的地址移到默认)">删组</button>' : ""}`;
  $("groups").querySelectorAll("[data-g]").forEach((b) => (b.onclick = () => { grp = b.dataset.g; store.set("trkGrp", grp); sel = null; renderSide(); renderHead(); loadFeed(); }));
  $("groups").querySelector('[data-act="addg"]').onclick = async () => { const n = prompt("新分组名"); if (n?.trim()) { try { await post("/api/track/group", { op: "add", name: n.trim() }); } catch (e) { toast(e.message, "err"); } } };
  $("groups").querySelector('[data-act="delg"]')?.addEventListener("click", async () => { if (confirm(`删除分组「${grp}」?里面的地址会移到「默认」`)) { try { await post("/api/track/group", { op: "delete", name: grp }); grp = "all"; } catch (e) { toast(e.message, "err"); } } });
  const list = L.targets.filter((t) => grp === "all" || t.group === grp);
  const last = {}; for (const e of items) if (!last[e.target]) last[e.target] = e.ts;
  $("tlist").innerHTML = list.length ? list.map((t) => `<div class="titem ${sel === t.address ? "on" : ""}" data-a="${t.address}">
      <div class="r1"><b title="${esc(t.handle ?? "")}">${esc(t.name || short(t.address))}</b><span class="tag">${esc(t.group)}</span>${!t.backfilledAt ? '<span class="tag" title="正在补最近 24 小时">回补中…</span>' : t.backfillPartial ? '<span class="tag" title="没配自己的节点,公共节点只查到最近约 1 小时">只补了 1 小时</span>' : ""}
        <button class="cpy" data-copyt="${t.address}" title="跟单这个地址">跟单</button><button class="x" data-del="${t.address}" title="取消关注">✕</button></div>
      <div class="r2"><span class="mono">${short(t.address)}</span>${last[t.address] ? `<span>最近 ${age(last[t.address])}</span>` : ""}</div>
      <div class="rm" data-rm="${t.address}" title="点击编辑备注">${esc(t.remark)}</div>
    </div>`).join("") : '<div class="empty"><span>还没有关注的地址</span><span class="faint">在上面填地址或 .ai 名字</span></div>';
  $("tlist").querySelectorAll(".titem").forEach((el) => (el.onclick = (e) => {
    if (e.target.closest("[data-del],[data-rm],[data-copyt]")) return;
    sel = sel === el.dataset.a ? null : el.dataset.a; renderSide(); renderHead(); loadFeed();
  }));
  $("tlist").querySelectorAll("[data-copyt]").forEach((b) => (b.onclick = () => openCopyDlg(b.dataset.copyt)));
  $("tlist").querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => {
    const t = L.targets.find((x) => x.address === b.dataset.del);
    if (!confirm(`取消关注 ${t?.name || b.dataset.del}?(已记下的历史动态保留)`)) return;
    try { await post("/api/track/remove", { address: b.dataset.del }); } catch (e) { toast(e.message, "err"); }
  }));
  $("tlist").querySelectorAll("[data-rm]").forEach((el) => (el.onclick = async () => {
    const t = L.targets.find((x) => x.address === el.dataset.rm);
    const v = prompt(`给 ${t?.name || short(t?.address)} 写备注`, t?.remark ?? "");
    if (v === null) return;
    try { await post("/api/track/update", { address: el.dataset.rm, remark: v }); } catch (e) { toast(e.message, "err"); }
  }));
}
function renderHead() {
  const t = sel ? L.targets.find((x) => x.address === sel) : null;
  $("fTitle").innerHTML = t ? `${esc(t.name || short(t.address))} <a class="faint mono" style="font-size:12px;font-weight:400" href="https://bscscan.com/address/${t.address}" target="_blank" rel="noopener">${t.address} ↗</a>` : grp === "all" ? "全部动态" : `分组「${esc(grp)}」的动态`;
  const st = L.status;
  $("fNote").textContent = (st?.running ? "正在补历史… " : "") + (st?.last?.error ? "上次回补失败:" + st.last.error + " " : "") + (L.hasPrivate === false ? "没配自己的节点:历史只能补最近约 1 小时(.env 配 BSC_LOG_RPC 可补 24 小时)" : "");
}
function row(e, isNew) {
  const plat = PF[e.platform] ?? e.platform;
  return `<tr class="${isNew ? "new" : ""}">
    <td class="faint" title="${esc(fullTime(e.ts))}">${age(e.ts)}${e.backfill ? ' <span class="tag" title="添加关注时从链上补的历史">补</span>' : ""}</td>
    <td><span class="who" data-who="${e.target}">${esc(e.targetName || short(e.target))}</span></td>
    <td><span class="act ${esc(e.action)}">${esc(e.action)}</span>${e.pct ? ` <span class="faint">${e.pct.toFixed(0)}%</span>` : ""}</td>
    <td><span class="tok" data-ca="${e.ca}" title="在交易页打开">${esc(e.symbol)}</span> <span class="pf">${esc(plat)}</span>
      <div class="cal"><span class="mono" title="${e.ca}">${short(e.ca)}</span><span class="tk-hov"><button class="cp" data-copy="${e.ca}" title="复制 CA">复制</button><a class="cp" href="https://x.com/search?q=${e.ca}&f=live" target="_blank" rel="noopener" title="在 X 上搜这个 CA(看谁在喊)" style="text-decoration:none">𝕏</a></span></div></td>
    <td class="num"><span class="${e.side === "buy" ? "up" : "down"}">${num(e.quoteAmt)}</span> <span class="faint">${esc(e.quote)}</span>${e.usd ? ` <span class="mute">≈$${num(e.usd)}</span>` : ""}</td>
    <td class="num faint">${num(e.tokens)}</td>
    <td class="tk-ops"><a class="go" href="/trade?ca=${e.ca}" target="_blank" rel="noopener" title="在交易页打开这个币">去交易</a><a class="tk-tx" href="https://bscscan.com/tx/${e.tx}" target="_blank" rel="noopener" title="在 BscScan 看这笔交易">${ICON("ext", 12)}</a></td>
  </tr>`;
}
// 加载中:3 行固定高度的骨架
const SKEL = `<table class="tk-feed"><tbody>${'<tr class="tk-sk"><td colspan="7"><div></div></td></tr>'.repeat(3)}</tbody></table>`;
function renderFeed(newIds = new Set()) {
  if (!items.length) {
    $("feed").innerHTML = loading ? SKEL : L.targets.length ? '<div class="empty">还没有动态(这些地址在内盘有买卖就会出现在这里)</div>'
      : '<div class="empty"><span>先在左边添加要关注的地址</span><button class="tk-emact" id="emAdd">添加地址</button></div>';
    $("emAdd")?.addEventListener("click", () => $("aIn").focus());
    return;
  }
  $("feed").innerHTML = `<table class="tk-feed"><thead><tr><th>时间</th><th>谁</th><th>动作</th><th>代币</th><th>金额</th><th>代币数</th><th></th></tr></thead><tbody>${items.map((e) => row(e, newIds.has(e.id))).join("")}</tbody></table>` +
    (more ? '<div class="more"><button id="moreBtn">加载更早的</button></div>' : "");
  $("feed").querySelectorAll("[data-ca]").forEach((x) => (x.onclick = () => window.open("/trade?ca=" + x.dataset.ca, "_blank")));
  $("feed").querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = "已复制"; setTimeout(() => (b.textContent = "复制"), 900); }, () => toast("复制失败", "err"))));
  $("feed").querySelectorAll("[data-who]").forEach((x) => (x.onclick = () => { sel = x.dataset.who; grp = "all"; renderSide(); renderHead(); loadFeed(); }));
  $("moreBtn")?.addEventListener("click", () => loadFeed(true));
}
async function loadFeed(older = false) {
  loading = true; if (!older) { items = []; renderFeed(); }
  try {
    const d = await post("/api/track/feed", { limit: 150, target: sel, group: sel ? null : grp, before: older && items.length ? items[items.length - 1].ts : undefined });
    items = older ? items.concat(d.items) : d.items; more = d.more;
  } catch (e) { toast("读动态失败:" + e.message, "err"); }
  loading = false; renderFeed(); renderSide();
}
$("aGo").onclick = async () => {
  const input = $("aIn").value.trim(); if (!input) return $("aIn").focus();
  $("aGo").disabled = true; $("aGo").textContent = "添加中…";
  try {
    const t = await post("/api/track/add", { input, remark: $("aRm").value.trim(), group: $("aGrp").value });
    toast(`已关注 ${t.name || short(t.address)},正在补最近 24 小时`, "ok");
    $("aIn").value = ""; $("aRm").value = "";
  } catch (e) { toast("添加失败:" + e.message, "err"); }
  $("aGo").disabled = false; $("aGo").textContent = "添加关注";
};
$("aIn").onkeydown = (e) => { if (e.key === "Enter") $("aGo").click(); };

// 实时:关注的地址有新买卖就插到最上面
let es = null, listT = null;
function startStream() {
  try { es?.close(); } catch {}
  es = new EventSource("/api/stream?t=" + TOKEN);
  es.onopen = () => { $("liveDot").className = "dot on"; };
  es.onerror = async () => { $("liveDot").className = "dot off"; if (es.readyState === 2 && (window.TP_PUBLIC || (await refreshToken()))) setTimeout(startStream, window.TP_PUBLIC ? 5000 + Math.random() * 10000 : 1000); };
  es.onmessage = (m) => {
    let ev; try { ev = JSON.parse(m.data); } catch { return; }
    window.tpLocalPop?.event(ev);   // 网站请求的配对 / 批准 / 登录,和(重新)连上的 hello:交给本机弹窗
    if (ev.type === "copy-tasks" || ev.type === "copy-log") return window.copyOnEvent?.(ev);
    if (ev.type === "track-list") { clearTimeout(listT); listT = setTimeout(async () => { const wasRunning = L.status?.running; await loadList(); if (wasRunning && !L.status?.running) loadFeed(); }, 300); return; }
    if (ev.type !== "track") return;
    const t = L.targets.find((x) => x.address === ev.target);
    if ($("sndOn").checked) beep();
    toast(`${ev.targetName || short(ev.target)} ${ev.action} ${ev.symbol} ${FMT.amt(ev.quoteAmt, ev.quote)}`, ev.side === "buy" ? "ok" : "err", ev.ca, "bell");
    if (sel ? ev.target !== sel : grp !== "all" && t?.group !== grp) return;
    if (items.some((x) => x.id === ev.id)) return;
    items.unshift(ev); renderFeed(new Set([ev.id])); renderSide();
  };
}
setInterval(() => { if (!document.hidden && items.length) renderFeed(); }, 30_000);   // 刷新「几分前」
loadList().then(() => loadFeed());
startStream();
// ---------- 跟单 ----------
// 任务和记录都在本机(panel/copy-tasks.json / copy-log.jsonl);新任务一律「暂停 + 模拟」,真实下单前再确认一次
let CP = { tasks: [], paused: false, log: [], defaults: {} }, view = store.get("trkView", "feed"), cpHist = false, cpEdit = null;
const KIND = { order: ["下单", "up"], sim: ["模拟", ""], skip: ["跳过", "faint"], fail: ["失败", "down"], error: ["出错", "down"], stop: ["结束", "mute"] };
async function loadCopy() {
  try { CP = await post("/api/copy"); } catch (e) { toast("读跟单失败:" + e.message, "err"); }
  renderCopyTab(); if (view === "copy") renderCopy();
}
function renderCopyTab() {
  const run = CP.tasks.filter((t) => t.status === "running"), real = run.filter((t) => !t.params.dryRun).length;
  $("tabCopy").innerHTML = `跟单${run.length ? ` <span class="pill ${real ? "real" : ""}">${run.length}${real ? " 真实" : ""}</span>` : ""}`;
  $("killBtn").hidden = !CP.tasks.some((t) => t.status === "running") && !CP.paused;
  $("killBtn").textContent = CP.paused ? "恢复跟单" : "全部暂停";
  $("killBtn").classList.toggle("on", CP.paused);
}
function setView(v) {
  view = v; store.set("trkView", v);
  $("tabFeed").classList.toggle("on", v === "feed"); $("tabCopy").classList.toggle("on", v === "copy");
  $("feed").hidden = v !== "feed"; $("copyView").hidden = v !== "copy";
  if (v === "copy") renderCopy();
}
function summary(p) {
  const amt = p.mode === "ratio" ? `对方 ${p.ratioPct}%` : `${p.amountBnb} BNB`;
  return `${amt} × ${p.wallets.map((w) => "账号" + w).join(" + ")} · 单笔≤${p.maxPerTrade} · 每天≤${p.dailyCap}${p.onlyFirst ? " · 只跟建仓" : ""}${p.followSell ? " · 跟卖" : ""}`;
}
function renderCopy() {
  const list = CP.tasks.filter((t) => (cpHist ? t.status === "closed" : t.status !== "closed"));
  const st = (t) => t.status === "closed" ? `<span class="faint" title="${esc(t.closeReason ?? "")}">已关闭</span>`
    : t.status === "running" ? (CP.paused ? '<span class="down">被全部暂停</span>' : '<span class="up">运行中</span>') : '<span class="mute">已暂停</span>';
  const ops = (t) => t.status === "closed" ? `<button data-cdel="${t.id}">删除</button>`
    : `${t.status === "running" ? `<button data-cst="${t.id}:paused">暂停</button>` : `<button data-cst="${t.id}:running" class="go">启动</button>`}<button data-cedit="${t.id}">参数</button><button data-cst="${t.id}:closed">关闭</button>`;
  const rows = list.map((t) => {
    const p = t.params, n = p.dryRun ? t.stats.simCopies : t.stats.copies, open = Object.values(t.tokens ?? {}).filter((x) => x.open).length;
    return `<tr><td><b>${esc(t.name)}</b> <span class="tag ${p.dryRun ? "" : "realtag"}">${p.dryRun ? "模拟" : "真实下单"}</span><div class="faint mono" style="font-size:11px">${short(t.target)}</div><div class="faint" style="font-size:11px">${esc(summary(p))}</div></td>
      <td class="num">${n}${p.maxCopies ? " / " + p.maxCopies : ""} 次<div class="faint">${t.stats.buys} 买 · ${t.stats.sells} 卖${p.dryRun ? ` · 模拟 ${t.stats.sims}` : ""}</div></td>
      <td class="num">${num(t.stats.buyBnb)} BNB<div class="faint">持有 ${open} 个币</div></td>
      <td class="faint">${t.stats.lastAt ? age(Math.floor(t.stats.lastAt / 1000)) : "—"}</td>
      <td>${st(t)}</td><td class="ops">${ops(t)}</td></tr>`;
  }).join("");
  const logs = CP.log.slice(0, 200).map((e) => {
    const [k, cls] = KIND[e.kind] ?? [e.kind, ""];
    return `<tr><td class="faint">${age(e.ts)}</td><td>${esc(e.taskName)}</td><td><span class="lk ${cls}">${k}</span></td>
      <td>${e.token ? `<span class="tok" data-ca="${e.token}">${esc(e.symbol ?? short(e.token))}</span>` : ""}${e.action ? ` <span class="faint">${esc(e.action)}</span>` : ""}</td>
      <td class="lr">${esc(e.reason)}${e.results ? `<div class="faint">${Object.entries(e.results).map(([a, r]) => `账号${a} ${r.ok ? "✓" : "✗"} ${esc((r.last ?? []).join(" ").slice(0, 120))}`).join("<br>")}</div>` : ""}</td></tr>`;
  }).join("");
  $("copyView").innerHTML = `<div class="cbar"><button class="btn" id="cpNew">＋ 新建跟单</button>
      <div class="seg"><button class="${cpHist ? "" : "on"}" data-hist="0">活跃</button><button class="${cpHist ? "on" : ""}" data-hist="1">历史</button></div>
      <span class="faint" style="font-size:12px">对方在内盘(four / Gang / Flap)买卖时触发;靠追踪的实时动态,面板要开着才会跟</span></div>
    ${list.length ? `<table class="ctab"><thead><tr><th>任务</th><th>已跟</th><th>总买入</th><th>最近</th><th>状态</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      : cpHist ? '<div class="empty">没有已关闭的任务</div>'
      : '<div class="empty"><span>还没有跟单任务</span><button class="tk-emact" id="cpNew2">＋ 新建跟单</button><span class="faint">或在左边地址旁点「跟单」</span></div>'}
    <div class="lhead">跟单记录 <span class="faint">(每次决定都记:下单 / 模拟 / 跳过和原因)</span></div>
    ${logs ? `<table class="ltab"><tbody>${logs}</tbody></table>` : '<div class="empty">还没有记录</div>'}`;
  $("cpNew").onclick = () => openCopyDlg(sel);
  $("cpNew2")?.addEventListener("click", () => openCopyDlg(sel));
  $("copyView").querySelectorAll("[data-hist]").forEach((b) => (b.onclick = () => { cpHist = b.dataset.hist === "1"; renderCopy(); }));
  $("copyView").querySelectorAll("[data-cedit]").forEach((b) => (b.onclick = () => openCopyDlg(null, CP.tasks.find((t) => t.id === b.dataset.cedit))));
  $("copyView").querySelectorAll("[data-cdel]").forEach((b) => (b.onclick = async () => { if (confirm("删除这个已关闭的任务?(记录保留)")) { try { await post("/api/copy/tasks", { id: b.dataset.cdel, delete: true }); } catch (e) { toast(e.message, "err"); } } }));
  $("copyView").querySelectorAll("[data-cst]").forEach((b) => (b.onclick = async () => {
    const [id, status] = b.dataset.cst.split(":"), t = CP.tasks.find((x) => x.id === id), p = t.params;
    if (status === "closed" && !confirm(`关闭任务「${t.name}」?关闭后不能再启动(已买的币不会自动卖)`)) return;
    if (status === "running" && !p.dryRun && !confirm(`⚠️ 启动真实跟单「${t.name}」\n\n跟 ${t.target}\n钱包:${p.wallets.map((w) => "账号 " + w).join("、")}\n每次 ${p.mode === "ratio" ? "对方的 " + p.ratioPct + "%" : p.amountBnb + " BNB"}(每个钱包),单笔最多 ${p.maxPerTrade} BNB\n每个币最多 ${p.maxPerToken} BNB,每天最多 ${p.dailyCap} BNB\n最多跟 ${p.maxCopies || "不限"} 次${p.followSell ? "\n对方卖出时按比例跟卖" : ""}\n\n会真实花钱下单,确定启动?`)) return;
    try { await post("/api/copy/tasks", { id, status }); } catch (e) { toast(e.message, "err"); }
  }));
  $("copyView").querySelectorAll("[data-ca]").forEach((x) => (x.onclick = () => window.open("/trade?ca=" + x.dataset.ca, "_blank")));
}
function openCopyDlg(target, task = null) {
  cpEdit = task;
  const p = task?.params ?? CP.defaults;
  $("cpTitle").textContent = task ? `跟单参数 · ${task.name}` : "新建跟单";
  $("cpTarget").value = task?.target ?? target ?? ""; $("cpTarget").disabled = !!task;
  $("cpName").value = task?.name ?? (target ? L.targets.find((t) => t.address === target)?.name ?? "" : "");
  const set = (id, v) => ($(id).value = v ?? "");
  $("cpMode").value = p.mode; set("cpAmt", p.amountBnb); set("cpRatio", p.ratioPct); set("cpMaxCopies", p.maxCopies); set("cpMaxTrade", p.maxPerTrade);
  set("cpMaxToken", p.maxPerToken); set("cpDaily", p.dailyCap); set("cpMaxOpen", p.maxOpen); set("cpMinT", p.minTargetBnb); set("cpMaxT", p.maxTargetBnb);
  set("cpMaxMc", p.maxMcUsd); set("cpDelay", p.maxDelaySec); set("cpSlip", p.slippage);
  $("cpOnlyFirst").checked = !!p.onlyFirst; $("cpFollowSell").checked = !!p.followSell; $("cpDry").checked = !!p.dryRun;
  document.querySelectorAll("#cpDlg [data-pf]").forEach((c) => (c.checked = p.platforms.includes(c.dataset.pf)));
  document.querySelectorAll("#cpDlg [data-w]").forEach((c) => (c.checked = p.wallets.includes(c.dataset.w)));
  const mode = () => { $("cpAmtL").hidden = $("cpMode").value !== "fixed"; $("cpRatioL").hidden = $("cpMode").value !== "ratio"; };
  $("cpMode").onchange = mode; mode();
  $("cpErr").textContent = ""; $("cpDlg").hidden = false;
}
$("cpClose").onclick = () => ($("cpDlg").hidden = true);
$("cpDlg").onclick = (e) => { if (e.target.id === "cpDlg") $("cpDlg").hidden = true; };
$("cpSave").onclick = async () => {
  const v = (id) => Number($(id).value);
  const params = {
    mode: $("cpMode").value, amountBnb: v("cpAmt"), ratioPct: v("cpRatio"), maxCopies: v("cpMaxCopies"), maxPerTrade: v("cpMaxTrade"), maxPerToken: v("cpMaxToken"),
    dailyCap: v("cpDaily"), maxOpen: v("cpMaxOpen"), minTargetBnb: v("cpMinT"), maxTargetBnb: v("cpMaxT"), maxMcUsd: v("cpMaxMc"), maxDelaySec: v("cpDelay"), slippage: v("cpSlip"),
    onlyFirst: $("cpOnlyFirst").checked, followSell: $("cpFollowSell").checked, dryRun: $("cpDry").checked,
    platforms: [...document.querySelectorAll("#cpDlg [data-pf]:checked")].map((c) => c.dataset.pf),
    wallets: [...document.querySelectorAll("#cpDlg [data-w]:checked")].map((c) => c.dataset.w),
  };
  if (!params.platforms.length) return ($("cpErr").textContent = "至少选一个平台");
  if (!params.wallets.length) return ($("cpErr").textContent = "至少选一个钱包");
  if (cpEdit?.status === "running" && cpEdit.params.dryRun && !params.dryRun && !confirm("这个任务正在运行,关掉模拟后马上会真实下单,确定?")) return;
  $("cpSave").disabled = true;
  try {
    if (cpEdit) await post("/api/copy/tasks", { id: cpEdit.id, name: $("cpName").value.trim(), params });
    else {
      const target = $("cpTarget").value.trim();
      if (!/^0x[0-9a-fA-F]{40}$/.test(target)) throw new Error("地址格式不对");
      await post("/api/copy/tasks", { target, name: $("cpName").value.trim(), params });
      toast("已建好跟单任务(暂停中),在列表里点「启动」", "ok");
    }
    $("cpDlg").hidden = true; setView("copy");
  } catch (e) { $("cpErr").textContent = e.message; }
  $("cpSave").disabled = false;
};
$("tabFeed").onclick = () => setView("feed");
$("tabCopy").onclick = () => setView("copy");
$("killBtn").onclick = async () => {
  if (!CP.paused && !confirm("暂停所有跟单任务?(已经在跑的那一单不受影响)")) return;
  try { CP = { ...CP, ...(await post("/api/copy/pause-all", { paused: !CP.paused })) }; renderCopyTab(); if (view === "copy") renderCopy(); } catch (e) { toast(e.message, "err"); }
};
let cpT = null;
window.copyOnEvent = (ev) => {
  if (ev.type === "copy-log" && ["order", "fail", "error", "stop"].includes(ev.kind)) toast(`跟单「${ev.taskName}」${KIND[ev.kind]?.[0] ?? ""}:${ev.symbol ?? ""} ${ev.reason}`, ev.kind === "order" ? "ok" : "err", ev.token);
  clearTimeout(cpT); cpT = setTimeout(loadCopy, 300);
};
setView(view); loadCopy();
setInterval(() => { if (!document.hidden && view === "copy") renderCopy(); }, 30_000);
</script>
<script>
document.getElementById("setBtn").onclick = (e) => { e.stopPropagation(); const m = document.getElementById("setMenu"); m.hidden = !m.hidden; };
document.addEventListener("click", (e) => { if (!e.target.closest(".setwrap")) document.getElementById("setMenu").hidden = true; });
</script>
