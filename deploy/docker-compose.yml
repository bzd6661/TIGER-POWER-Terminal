# 在服务器上:cd 仓库目录 && docker compose -f deploy/docker-compose.yml up -d --build
services:
  tp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env          # 可选:BSC_RPC / BSC_LOG_RPC 等自己的节点(见 deploy/.env.example)
        required: false
    environment:
      PUBLIC_ORIGINS: https://tigerpower.online,https://www.tigerpower.online
    volumes:
      - tpdata:/data          # 扫链缓存、成交缓存(SQLite)、代币图标,重启 / 升级不丢
    expose:
      - "8080"
    logging:
      options: { max-size: "20m", max-file: "3" }

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # HTTPS 证书
      - caddy_config:/config
    depends_on:
      - tp

volumes:
  tpdata:
  caddy_data:
  caddy_config:
